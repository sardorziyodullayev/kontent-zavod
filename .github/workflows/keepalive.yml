# Render free 15 daqiqa so'rovsiz qolsa serverni uxlatadi, shunda worker ham to'xtaydi.
# Serverning o'z-o'ziga ping'i yetmadi, shuning uchun tashqaridan har 5 daqiqada uyg'otamiz.
name: keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 120 https://kontent-zavod-8y6n.onrender.com/api/health
